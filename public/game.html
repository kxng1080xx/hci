<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Host</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="/quiz-host.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0e;
      --surface: #1a1a19;
      --line: #33332f;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --muted: #8f8e86;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1, h2, h3, p { margin: 0; }
    .sub { color: var(--text-2); font-size: 16px; }
    .empty { color: var(--muted); font-size: 18px; }
    .qr { background: #fff; padding: 10px; border-radius: 12px; }
    .qr svg { width: 100%; height: 100%; display: block; }

    /* The dialog styles, stretched to fill the page, with a players column beside the stage. */
    .qd.game { width: 100%; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; }
    .game-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
    .game-main .qd-body { border-right: 1px solid var(--line); }
    .side { display: flex; flex-direction: column; min-height: 0; padding: 18px 16px; gap: 12px; }
    .side h2 { font-size: 20px; }
    .side ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: grid; gap: 6px; align-content: start; }
    .side li { display: grid; grid-template-columns: 34px 1fr auto 36px; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 18px; }
    .side .av { font-size: 24px; line-height: 1; }
    .side .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .side .st { font-variant-numeric: tabular-nums; color: var(--text-2); }
    .side .yes { color: #4ade80; font-weight: 800; }
    .side .no { color: var(--muted); }
    .kick { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
    .kick:hover, .kick:focus-visible { background: #3a1d1d; color: #fca5a5; outline: none; }
    .qd-head a { color: var(--text-2); font-size: 16px; }
    @media (max-width: 900px) {
      .game-main { grid-template-columns: 1fr; grid-template-rows: auto auto; }
      .qd.game { height: auto; min-height: 100dvh; }
      .game-main .qd-body { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="quiz" class="qd game">
    <div class="qd-head">
      <h1 id="qd-title" style="font-size:26px">Emotion quiz · Host</h1>
      <span class="qd-phase" id="qd-phase"></span>
      <a href="/results">Class results</a>
    </div>
    <div class="game-main">
      <main class="qd-body" id="qd-body" aria-live="polite"></main>
      <aside class="side" id="qd-players" aria-label="Players">
        <h2>Players · <span id="qd-players-n">0</span></h2>
        <ol id="qd-players-list"></ol>
      </aside>
    </div>
    <div class="qd-foot">
      <span class="status" id="qd-status"></span>
      <button type="button" class="ghost" id="qd-reset">Reset quiz</button>
      <button type="button" class="ghost" id="qd-end" hidden>End question now</button>
      <button type="button" class="go" id="qd-next">Start quiz</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="/quiz-host.js"></script>
</body>
</html>
